doctrine:
    dbal:
        default_connection: default
        connections:
            # Application : rôle pretoutil_app aux droits minimaux (SELECT, INSERT, UPDATE ;
            # DELETE seulement sur objet). Utilisée par tous les repositories.
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
            # Propriétaire du schéma : migrations (doctrine_migrations.yaml) et fixtures
            # (doctrine:fixtures:load --em=proprietaire). Jamais utilisée par l'application.
            proprietaire:
                url: '%env(resolve:DATABASE_OWNER_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                auto_mapping: true
                # Recherche par nom sans tenir compte des accents (ticket #109).
                dql:
                    string_functions:
                        UNACCENT: App\Doctrine\Fonction\Unaccent
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
            proprietaire:
                connection: proprietaire
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'

when@test:
    doctrine:
        dbal:
            connections:
                # "TEST_TOKEN" is typically set by ParaTest
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                proprietaire:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                proprietaire:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
