# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Jetons CSRF stockés en session (formulaire de connexion, déconnexion, formulaires Symfony)
    csrf_protection: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

# Production derrière Traefik (Dokploy, ticket #115) : la requête arrive du proxy en HTTP.
# Les en-têtes X-Forwarded-* ne sont crus que s'ils viennent d'une adresse de TRUSTED_PROXIES
# (réseaux privés du serveur), jamais d'un client.
when@prod:
    framework:
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

