---
services:
  php:
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}}
      MERCURE_TRUSTED_ISSUERS: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
    # Mots de passe (non versionnés) : Symfony construit DATABASE_URL, DATABASE_OWNER_URL
    # et MONGODB_URI dans .env à partir de ces variables.
    env_file:
      - path: .env.local
        required: true
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    # POSTGRES_PASSWORD (propriétaire) et POSTGRES_APP_PASSWORD (pretoutil_app)
    env_file:
      - path: .env.local
        required: true
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # Exécuté une seule fois, à la création du volume : crée le rôle pretoutil_app
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> doctrine/mongodb-odm-bundle ###
  mongodb:
    image: mongo:${MONGODB_VERSION:-8.0}
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-app}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-app}
    # MONGO_INITDB_ROOT_PASSWORD (root) et MONGODB_APP_PASSWORD (pretoutil_app)
    env_file:
      - path: .env.local
        required: true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mongodb_data:/data/db:rw
      # Exécutés une seule fois, à la création du volume, dans la base MONGO_INITDB_DATABASE :
      # 1. collection audit_log (validateur, index) et rôle auditAppendOnly, 2. utilisateur pretoutil_app
      - ./docs/conception/audit_log.mongodb.js:/docker-entrypoint-initdb.d/01-audit_log.js:ro
      - ./docker/mongodb/initdb/02-utilisateur-app.js:/docker-entrypoint-initdb.d/02-utilisateur-app.js:ro
###< doctrine/mongodb-odm-bundle ###

volumes:
  caddy_data:
